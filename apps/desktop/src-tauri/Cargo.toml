[package]
name = "guildhall-desktop"
version = "0.1.0"
description = "Guildhall desktop shell: a native window around the Guildhall game."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
