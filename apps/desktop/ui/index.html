<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guildhall</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2a1d14; color: #f2e3c6; font: 18px monospace; }
      form { display: grid; gap: 12px; width: min(28rem, 90vw); }
      input, button { font: inherit; padding: 10px; border: 2px solid #8a5a33; background: #3f2718; color: inherit; }
      button { background: #c88a1a; color: #2a1d14; cursor: pointer; }
      #error { color: #ff8a7a; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>Guildhall</h1>
      <label for="address">Where is your Guildhall? (the address you open in a browser)</label>
      <input id="address" placeholder="guild.example.com" />
      <button type="submit">Enter the guild</button>
      <div id="error" role="alert"></div>
    </form>
    <script>
      document.getElementById('address').focus()
      document.getElementById('form').addEventListener('submit', async (event) => {
        event.preventDefault()
        try {
          await window.__TAURI__.core.invoke('set_server_url', {
            address: document.getElementById('address').value,
          })
        } catch (error) {
          document.getElementById('error').textContent = String(error)
        }
      })
    </script>
  </body>
</html>
