services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: guildhall
      POSTGRES_PASSWORD: guildhall
      POSTGRES_DB: guildhall
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guildhall -d guildhall']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Official minio/minio images are no longer published; Chainguard builds MinIO from source.
    # Its free tier only tags :latest; the tag plus digest is pinned so Dependabot can track and
    # bump it (a bare digest is not a trackable reference).
    image: cgr.dev/chainguard/minio:latest@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guildhall
      MINIO_ROOT_PASSWORD: guildhall-dev-secret
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Scheduled backups (profile `backup`: `docker compose --profile backup up -d`). Postgres gets a
  # custom-format dump per interval, object storage a mirror. The KEY_FILE master key is NOT here:
  # back it up separately (docs/runbooks/backup-restore.md).
  # One-shot: the shared volume is created root-owned, but backup-objects runs as the image's
  # non-root user (uid 65532), so prepare the two directories once with the right owners.
  backup-init:
    profiles: [backup]
    image: cgr.dev/chainguard/busybox:latest@sha256:3c18e6cdb5f95843aad56a92d8579e5e41c84814ded9f4265c83fa8f7d92b104
    user: root
    entrypoint: ['/bin/sh', '-c']
    command:
      - mkdir -p /backups/postgres /backups/objects && chown 65532:65532 /backups/objects
    volumes:
      - backup-data:/backups

  backup-postgres:
    profiles: [backup]
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: guildhall
      PGPASSWORD: guildhall
      PGDATABASE: guildhall
      BACKUP_INTERVAL_SECONDS: '${BACKUP_INTERVAL_SECONDS:-86400}'
      BACKUP_KEEP: '${BACKUP_KEEP:-14}'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        while true; do
          out="/backups/postgres/guildhall-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          mkdir -p /backups/postgres
          pg_dump -Fc -f "$$out.partial" && mv "$$out.partial" "$$out"
          ls -1t /backups/postgres/*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - backup-data:/backups

  backup-objects:
    profiles: [backup]
    image: cgr.dev/chainguard/minio:latest@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
    depends_on:
      backup-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      MC_HOST_source: http://guildhall:guildhall-dev-secret@minio:9000
      BACKUP_INTERVAL_SECONDS: '${BACKUP_INTERVAL_SECONDS:-86400}'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        while true; do
          mc mirror --overwrite source /backups/objects
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - backup-data:/backups

  # Sandboxes (profile `sandbox`): the egress proxy is the only way out of a worker container. It
  # joins the internal `sandbox` network (no route out) and the `egress` network, and forwards only
  # to EGRESS_ALLOWED_HOSTS (host:port pairs): the model gateway and MCP gateway, nothing else, on no
  # other port. guildd runs on the host in development, so the default is host.docker.internal:8787.
  # Workers are not services: guildd starts them per Quest (SANDBOX_RUNNER=docker), hardened, on the
  # `sandbox` network. Build the worker image once with
  # `docker compose --profile sandbox build worker-image`, then set SANDBOX_IMAGE to its image id.
  egress-proxy:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: docker/egress-proxy.Dockerfile
    image: guildhall-egress-proxy:local
    environment:
      EGRESS_ALLOWED_HOSTS: '${EGRESS_ALLOWED_HOSTS:-host.docker.internal:8787}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [sandbox, egress]

  worker-image:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: guildhall-worker:local
    entrypoint: ['true']
    network_mode: none

volumes:
  backup-data:
  postgres-data:
  minio-data:

networks:
  # Internal: containers on it have no route to the internet or the host. The egress proxy is
  # attached to both, so it is the only path out.
  sandbox:
    name: guildhall-sandbox
    internal: true
  egress:
    name: guildhall-egress
