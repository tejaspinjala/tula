services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: guildhall
      POSTGRES_PASSWORD: guildhall
      POSTGRES_DB: guildhall
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guildhall -d guildhall']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guildhall
      MINIO_ROOT_PASSWORD: guildhall-dev-secret
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
