services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: guildhall
      POSTGRES_PASSWORD: guildhall
      POSTGRES_DB: guildhall
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guildhall -d guildhall']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Official minio/minio images are no longer published; Chainguard builds MinIO from source.
    # Its free tier only tags :latest; the tag plus digest is pinned so Dependabot can track and
    # bump it (a bare digest is not a trackable reference).
    image: cgr.dev/chainguard/minio:latest@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guildhall
      MINIO_ROOT_PASSWORD: guildhall-dev-secret
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Scheduled backups (profile `backup`: `docker compose --profile backup up -d`). Postgres gets a
  # custom-format dump per interval, object storage a mirror. The KEY_FILE master key is NOT here:
  # back it up separately (docs/runbooks/backup-restore.md).
  backup-postgres:
    profiles: [backup]
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: guildhall
      PGPASSWORD: guildhall
      PGDATABASE: guildhall
      BACKUP_INTERVAL_SECONDS: '${BACKUP_INTERVAL_SECONDS:-86400}'
      BACKUP_KEEP: '${BACKUP_KEEP:-14}'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        while true; do
          out="/backups/postgres/guildhall-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          mkdir -p /backups/postgres
          pg_dump -Fc -f "$$out.partial" && mv "$$out.partial" "$$out"
          ls -1t /backups/postgres/*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - backup-data:/backups

  backup-objects:
    profiles: [backup]
    image: cgr.dev/chainguard/minio:latest@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_source: http://guildhall:guildhall-dev-secret@minio:9000
      BACKUP_INTERVAL_SECONDS: '${BACKUP_INTERVAL_SECONDS:-86400}'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        while true; do
          mc mirror --overwrite source /backups/objects
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - backup-data:/backups

volumes:
  backup-data:
  postgres-data:
  minio-data:
