name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Contract tests run against real Postgres (same image tag as docker-compose.yml).
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: guildhall
          POSTGRES_PASSWORD: guildhall
          POSTGRES_DB: guildhall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guildhall -d guildhall"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://guildhall:guildhall@localhost:5432/guildhall
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: guildhall
      OBJECT_STORE_SECRET_KEY: guildhall-dev-secret
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Service containers cannot take a command, and this image needs `server /data`, so MinIO
      # (same image as docker-compose.yml) is started here.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=guildhall -e MINIO_ROOT_PASSWORD=guildhall-dev-secret \
            cgr.dev/chainguard/minio:latest@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6 \
            server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - run: bun run verify
      - run: bun run test:integration

  pr-rules:
    name: pr-rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Untrusted PR fields go through env, never inline expressions, so they cannot inject shell.
      - name: Conventional Commits PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -qE '^(feat|fix|refactor|perf|build|ci|docs|test|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "PR title must match '<type>(<scope>)?: <summary>'" >&2
            exit 1
          fi
      - name: Only release or hotfix branches target main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" = "main" ] && ! printf '%s\n' "$HEAD" | grep -qE '^(release|hotfix)/'; then
            echo "PRs into main must come from release/* or hotfix/* (got $HEAD)" >&2
            exit 1
          fi
