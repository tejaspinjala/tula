# Always latest, majors included; grouped weekly to keep PR noise low.
version: 2
updates:
  # npm covers every workspace (root, apps/*, packages/*) and bun.lock.
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Compose service images are pinned by digest (MinIO has no versioned free tags); keep them moving.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ['*']
    commit-message:
      prefix: build
