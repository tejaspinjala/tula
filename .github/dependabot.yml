# GitHub Actions versions only for now; npm stays with `bun add` until a release-age policy exists.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Compose service images are pinned by digest (MinIO has no versioned free tags); keep them moving.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
